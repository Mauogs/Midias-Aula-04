<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML</title>
</head>

<body>
    <header>

    </header>

    <main>
        <table border="1">
            <thead>
                <tr>
                    <td>Aula 04 - Mídias em HTML</td>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <h2>Imagens</h2>

                        <img src="img/Paisagem_Minas_Gerais.jpg" alt="Paisagem de Minas Gerais" width="100" height="50">
                        <img src="img/Paisagem_Outono.jpg" alt="Paisagem de Outono" width="100" height="50">
                        <img src="img/Paisagem_Praia.jpg" alt="Paisagem de Praia">
                    </td>

                    <td>
                        <h2>Video</h2>

                        <video controls src="video/Cascatinha_E_Inhana_India.mp4" width="100%"
                            poster="img/Paisagem_Minas_Gerais.jpg"></video>
                    </td>

                    <td>
                        <h2>Áudio</h2>

                        <audio controls>
                            <source src="audio/Cascatinha_E_Inhana_India.mp3" type="audio/mpeg">
                            <source src="audio/Cascatinha_E_Inhana_India.ogg" type="audio.ogg">
                            Seu navegador não suporta áudio.
                        </audio>
                    </td>
                </tr>

                <tr>

                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td>&copy Exemplo didático de HTML</td>
                </tr>
            </tfoot>
        </table>
    </main>

    <footer>

    </footer>
</body>

</html>
